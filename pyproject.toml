[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suppliergraph"
version = "0.1.0"
description = "Procurement and supplier-risk knowledge graph: RDF/OWL/SHACL, R2RML ETL, entity resolution, graph ML and GraphRAG"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "owlrl>=7.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
etl = ["morph-kgc>=2.7", "falcon>=3.1", "psycopg[binary]>=3.1"]
ml = ["torch>=2.2"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
sg = "suppliergraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suppliergraph = ["staging/*.sql", "eval/*.yaml", "rag/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E702", "E402", "B008", "B905"]
