# Data-product catalogue: one named graph per data product, with provenance metadata.
# Licence notes are deliberately NOT asserted here; fill them in after you have checked each source.
products:
  - id: gleif
    title: GLEIF LEI golden copy (level 1 and 2)
    description: Legal entities and consolidation relationships.
    source_note: "Source: GLEIF. Licence terms: TO BE VERIFIED by the operator."
  - id: tenders
    title: Public procurement notices (OCDS)
    description: Tenders, awards and the parties named in them.
    source_note: "Source: OCDS publisher(s) configured in config/sources.yaml. Licence: TO BE VERIFIED."
  - id: cpv
    title: Common Procurement Vocabulary
    description: Product and service taxonomy for public procurement.
    source_note: "Source: EU Publications Office. Licence: TO BE VERIFIED."
  - id: sanctions
    title: Sanction list entries
    description: Entities on sanctions or watch lists.
    source_note: "Source: list provider configured in config/sources.yaml. Licence and permitted use: TO BE VERIFIED."
  - id: entity-resolution
    title: Entity-resolution matches
    description: Scored candidate matches between legal entities and sanction entries (leads for review).
    source_note: "Generated by this project (suppliergraph.er)."
  - id: extraction
    title: Text-extraction outputs
    description: CPV links, standards and regulatory obligations extracted from text, with provenance.
    source_note: "Generated by this project (suppliergraph.extract)."
  - id: regulations
    title: Regulation texts
    description: Legal acts from which obligations are extracted.
    source_note: "Source: EUR-Lex or national publication. Licence: TO BE VERIFIED."
